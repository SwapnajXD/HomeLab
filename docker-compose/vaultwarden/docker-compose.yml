services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - ROCKET_PORT=443
      - ROCKET_TLS={certs="/certs/cert.crt",key="/certs/cert.key"}
      - SIGNUPS_ALLOWED=false  # 🔐 Shuts down the registration gate for outsiders
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
    ports:
      - "8080:443"
