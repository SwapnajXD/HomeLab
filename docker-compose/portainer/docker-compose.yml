services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Grants Portainer management access to local engine sockets
      - portainer_data:/data # Preserves user credentials and engine settings through container updates

volumes:
  portainer_data:
