services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - 9090:9090

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - 9100:9100

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3001:3000   # Maps internal port 3000 to external host port 3001 to avoid conflicts
    volumes:
      - grafana_data:/var/lib/grafana

  proxmox-exporter:
    image: promhippie/proxmox-ve-exporter:latest
    container_name: proxmox-exporter
    restart: unless-stopped
    environment:
      - PVE_USER=root@pam
      - PVE_PASSWORD=${PROXMOX_ROOT_PASSWORD}  # Docker engine pulls this out of the local .env block automatically
      - PVE_VERIFY_SSL=false
    ports:
      - 9221:9221

volumes:
  prometheus_data:
  grafana_data:
